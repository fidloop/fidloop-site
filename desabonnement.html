<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Désabonnement – Ancrimo</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f5f3ee; margin: 0; padding: 40px 16px; display: flex; justify-content: center; color: #1a1a1a; }
  .carte { background: #fff; border-radius: 14px; padding: 32px 26px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 2px 14px rgba(0,0,0,0.08); }
  .logo { font-weight: bold; font-size: 15px; letter-spacing: 1px; color: #4faa38; margin-bottom: 18px; }
  h1 { font-size: 21px; margin: 0 0 12px; }
  p { color: #555; font-size: 15px; line-height: 1.55; margin: 0 0 10px; }
</style>
</head>
<body>
  <div class="carte">
    <div class="logo">ANCRIMO</div>
    <h1 id="titre">Désabonnement confirmé</h1>
    <p id="texte">Vous ne recevrez plus d'offres promotionnelles de la boutique, ni par e-mail ni par SMS.</p>
    <p id="suite">Votre carte de fidélité reste active : vous continuez à cumuler vos points à chaque passage.</p>
  </div>
<script>
  (function () {
    var etat = new URLSearchParams(location.search).get("etat");
    var titre = document.getElementById("titre"), texte = document.getElementById("texte"), suite = document.getElementById("suite");
    if (etat === "invalide") {
      titre.textContent = "Lien incomplet";
      texte.textContent = "Ce lien de désabonnement est incomplet. Utilisez le lien reçu dans l'e-mail, ou demandez directement à votre boutique de vous désinscrire.";
      suite.textContent = "";
    } else if (etat === "erreur") {
      titre.textContent = "Une erreur est survenue";
      texte.textContent = "Votre demande n'a pas pu être enregistrée. Merci de réessayer un peu plus tard, ou de demander directement à votre boutique de vous désinscrire.";
      suite.textContent = "";
    }
  })();
</script>
</body>
</html>
