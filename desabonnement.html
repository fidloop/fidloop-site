<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Désabonnement – Ancrimo</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f5f3ee; margin: 0; padding: 40px 16px; display: flex; justify-content: center; color: #1a1a1a; }
  .carte { background: #fff; border-radius: 14px; padding: 32px 26px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 2px 14px rgba(0,0,0,0.08); }
  .logo { font-weight: bold; font-size: 15px; letter-spacing: 1px; color: #b23b20; margin-bottom: 18px; }
  h1 { font-size: 21px; margin: 0 0 12px; }
  p { color: #555; font-size: 15px; line-height: 1.55; margin: 0 0 10px; }
</style>
</head>
<body>
  <div class="carte">
    <div class="logo">ANCRIMO</div>
    <h1 id="titre">Désabonnement confirmé</h1>
    <p id="texte">Vous ne recevrez plus d'offres promotionnelles de la boutique, ni par e-mail ni par SMS.</p>
    <p id="suite">Votre carte de fidélité reste active : vous continuez à cumuler vos points à chaque passage.</p>
  </div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var etat = q.get("etat");
    // Langue de l'e-mail reçu (espagnol, italien : 22/11/2026), sinon français
    var langue = q.get("lang");
    var T = {
      fr: {
        page: "Désabonnement – Ancrimo",
        ok: ["Désabonnement confirmé", "Vous ne recevrez plus d'offres promotionnelles de la boutique, ni par e-mail ni par SMS.", "Votre carte de fidélité reste active : vous continuez à cumuler vos points à chaque passage."],
        invalide: ["Lien incomplet", "Ce lien de désabonnement est incomplet. Utilisez le lien reçu dans l'e-mail, ou demandez directement à votre boutique de vous désinscrire.", ""],
        erreur: ["Une erreur est survenue", "Votre demande n'a pas pu être enregistrée. Merci de réessayer un peu plus tard, ou de demander directement à votre boutique de vous désinscrire.", ""]
      },
      es: {
        page: "Darse de baja – Ancrimo",
        ok: ["Baja confirmada", "Ya no recibirás ofertas promocionales de la tienda, ni por email ni por SMS.", "Tu tarjeta de fidelidad sigue activa: sigues acumulando puntos en cada visita."],
        invalide: ["Enlace incompleto", "Este enlace de baja está incompleto. Utiliza el enlace recibido en el email, o pide directamente a tu tienda que te dé de baja.", ""],
        erreur: ["Se ha producido un error", "No se ha podido registrar tu solicitud. Inténtalo de nuevo más tarde, o pide directamente a tu tienda que te dé de baja.", ""]
      },
      it: {
        page: "Disiscrizione – Ancrimo",
        ok: ["Disiscrizione confermata", "Non riceverai più offerte promozionali dal negozio, né via email né via SMS.", "La tua carta fedeltà resta attiva: continui ad accumulare punti a ogni visita."],
        invalide: ["Link incompleto", "Questo link di disiscrizione è incompleto. Usa il link ricevuto nell'email, oppure chiedi direttamente al tuo negozio di cancellare l'iscrizione.", ""],
        erreur: ["Si è verificato un errore", "Non è stato possibile registrare la tua richiesta. Riprova più tardi, oppure chiedi direttamente al tuo negozio di cancellare l'iscrizione.", ""]
      }
    };
    var L = T[langue] ? langue : "fr";
    var t = T[L][etat === "invalide" || etat === "erreur" ? etat : "ok"];
    document.documentElement.lang = L;
    document.title = T[L].page;
    document.getElementById("titre").textContent = t[0];
    document.getElementById("texte").textContent = t[1];
    document.getElementById("suite").textContent = t[2];
  })();
</script>
</body>
</html>
