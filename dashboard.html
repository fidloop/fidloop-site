<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Réseau Pil'Vite</title>
<style>
  :root {
    --ink: #201d18;
    --ink-dim: #6b665c;
    --paper: #ffffff;
    --paper-dim: #f4f2ee;
    --yellow: #ffde2d;
    --yellow-deep: #f0c800;
    --green: #4faa38;
    --border: #e6e2da;
    --error: #c94a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper-dim);
    color: var(--ink);
    min-height: 100vh;
  }
  /* --- Écran mot de passe --- */
  #gate {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #gate .box {
    background: var(--paper);
    border: 3px solid var(--green);
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%; max-width: 360px;
    text-align: center;
  }
  #gate h1 { font-family: Georgia, serif; font-size: 22px; margin-bottom: 8px; }
  #gate p { color: var(--ink-dim); font-size: 14px; margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 14px 16px;
    background: var(--paper-dim); border: 2px solid var(--ink);
    border-radius: 10px; font-size: 16px; outline: none; text-align: center;
  }
  #gate input:focus { border-color: var(--green); }
  #gate button {
    width: 100%; margin-top: 16px; padding: 14px;
    border: none; border-radius: 10px; background: var(--yellow);
    color: var(--ink); font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #gate .err { color: var(--error); font-size: 13px; margin-top: 12px; display: none; }
  /* --- Dashboard --- */
  #dashboard { display: none; max-width: 1000px; margin: 0 auto; padding: 32px 20px 60px; }
  .top { text-align: center; margin-bottom: 36px; }
  .top .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--green); font-weight: 700; }
  .top h1 { font-family: Georgia, serif; font-size: 30px; margin-top: 8px; }
  .top p { color: var(--ink-dim); font-size: 14px; margin-top: 6px; }
  .totals {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .totals .card {
    background: var(--paper); border: 2px solid var(--border); border-radius: 12px;
    padding: 18px; text-align: center;
  }
  .totals .card .n { font-size: 28px; font-weight: 800; color: var(--green); }
  .totals .card .l { font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  .export-all {
    display: block; margin: 0 auto 36px; padding: 12px 22px;
    background: var(--ink); color: #fff; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .export-all:hover { opacity: 0.9; }
  .shop-export {
    margin-top: 12px; width: 100%; padding: 10px;
    background: var(--paper-dim); color: var(--ink); border: 2px solid var(--border);
    border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .shop-export:hover { border-color: var(--green); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .shop-card {
    background: var(--paper); border: 2px solid var(--border); border-radius: 14px;
    padding: 22px; cursor: pointer; transition: border-color 0.15s;
  }
  .shop-card:hover { border-color: var(--green); }
  .shop-card h3 { font-size: 17px; margin-bottom: 14px; }
  .shop-stats { display: flex; gap: 20px; margin-bottom: 14px; }
  .shop-stats div { flex: 1; }
  .shop-stats .n { font-size: 22px; font-weight: 700; }
  .shop-stats .l { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .bar-track { height: 8px; background: var(--paper-dim); border-radius: 6px; overflow: hidden; display: flex; }
  .bar-seg-6 { background: var(--yellow-deep); height: 100%; }
  .bar-seg-10 { background: var(--green); height: 100%; }
  .bar-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-dim); margin-top: 8px; }
  .bar-legend span::before { content: "●"; margin-right: 4px; }
  .bar-legend .l6::before { color: var(--yellow-deep); }
  .bar-legend .l10::before { color: var(--green); }
  .detail {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    display: none; max-height: 220px; overflow-y: auto;
  }
  .detail.open { display: block; }
  .detail-row {
    display: flex; justify-content: space-between; font-size: 13px;
    padding: 6px 0; border-bottom: 1px solid var(--paper-dim);
  }
  .detail-row .name { font-weight: 600; }
  .detail-row .cycle { color: var(--ink-dim); }
  .loading, .empty { text-align: center; color: var(--ink-dim); font-size: 14px; padding: 40px; }
  /* --- Campagnes --- */
  .campaign-box {
    background: var(--paper); border: 2px solid var(--border); border-radius: 14px;
    padding: 24px; margin-bottom: 36px;
  }
  .campaign-box h2 { font-size: 18px; margin-bottom: 4px; }
  .campaign-box .sub { color: var(--ink-dim); font-size: 13px; margin-bottom: 18px; }
  .campaign-field { margin-bottom: 14px; }
  .campaign-field label {
    display: block; font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--ink-dim); margin-bottom: 6px;
  }
  .campaign-box select,
  .campaign-box input[type="text"],
  .campaign-box textarea {
    width: 100%; padding: 12px 14px;
    background: var(--paper-dim); border: 2px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
  }
  .campaign-box select:focus,
  .campaign-box input[type="text"]:focus,
  .campaign-box textarea:focus { border-color: var(--green); }
  .campaign-box textarea { resize: vertical; min-height: 110px; }
  .campaign-count { font-size: 13px; color: var(--ink-dim); margin-bottom: 14px; }
  .campaign-count strong { color: var(--ink); }
  .campaign-send-btn {
    padding: 12px 22px; background: var(--yellow); color: var(--ink);
    border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .campaign-send-btn:disabled { opacity: 0.5; cursor: default; }
  .campaign-confirm {
    display: none; margin-top: 14px; padding: 14px; background: var(--paper-dim);
    border-radius: 10px; font-size: 13.5px;
  }
  .campaign-confirm.open { display: block; }
  .campaign-confirm .btns { margin-top: 10px; display: flex; gap: 10px; }
  .campaign-confirm button {
    padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: none;
  }
  .campaign-confirm .confirm-yes { background: var(--green); color: #fff; }
  .campaign-confirm .confirm-no { background: var(--border); color: var(--ink); }
  .campaign-result { margin-top: 14px; font-size: 13.5px; display: none; }
  .campaign-result.ok { color: var(--green); display: block; }
  .campaign-result.error { color: var(--error); display: block; }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h1>Espace Réseau</h1>
    <p>Accès réservé — Pil'Vite</p>
    <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="off">
    <button id="pwd-btn">Accéder</button>
    <div class="err" id="pwd-err">Mot de passe incorrect.</div>
  </div>
</div>
<div id="dashboard">
  <div class="top">
    <div class="eyebrow">Réseau Pil'Vite</div>
    <h1>Programme de fidélité</h1>
    <p>Vue d'ensemble des 6 boutiques</p>
  </div>
  <div class="totals" id="totals"></div>
  <button class="export-all" id="export-all-btn">⬇ Exporter tous les clients (CSV)</button>

  <div class="campaign-box" id="campaign-box">
    <h2>Envoyer une campagne email</h2>
    <div class="sub">Envoyé uniquement aux clients ayant donné leur consentement marketing et ayant un email renseigné.</div>
    <div class="campaign-field">
      <label for="campaign-boutique">Destinataires</label>
      <select id="campaign-boutique">
        <option value="">Tout le réseau</option>
      </select>
    </div>
    <div class="campaign-count" id="campaign-count"></div>
    <div class="campaign-count" id="campaign-quota"></div>
    <div class="campaign-field">
      <label for="campaign-subject">Sujet</label>
      <input type="text" id="campaign-subject" placeholder="Ex : -10% cette semaine chez Pil'Vite">
    </div>
    <div class="campaign-field">
      <label for="campaign-message">Message</label>
      <textarea id="campaign-message" placeholder="Votre message..." rows="6"></textarea>
    </div>
    <button class="campaign-send-btn" id="campaign-send-btn">Envoyer la campagne</button>
    <div class="campaign-confirm" id="campaign-confirm">
      <div id="campaign-confirm-text"></div>
      <div class="btns">
        <button class="confirm-yes" id="campaign-confirm-yes">Confirmer l'envoi</button>
        <button class="confirm-no" id="campaign-confirm-no">Annuler</button>
      </div>
    </div>
    <div class="campaign-result" id="campaign-result"></div>
  </div>

  <div class="grid" id="grid">
    <div class="loading">Chargement des données...</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://xreqpkzovokiheichauf.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ur4bRIDpnPAyaLffnN2xIg_ZnfNLNRn";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const NETWORK_STATS_URL = SUPABASE_URL + "/functions/v1/network-stats";
  const SEND_CAMPAIGN_URL = SUPABASE_URL + "/functions/v1/send-campaign";
  // Le mot de passe n'est plus vérifié ici : il est envoyé au serveur, qui seul
  // décide de renvoyer les données ou non. Même en lisant ce fichier, personne
  // ne peut voir le mot de passe ni contourner la vérification.
  // On le garde en mémoire après connexion pour pouvoir aussi appeler send-campaign
  // (revérifié côté serveur à chaque appel, comme network-stats).
  let DASHBOARD_PWD = null;
  let LAST_DATA = null;

  document.getElementById("pwd-btn").addEventListener("click", checkPassword);
  document.getElementById("pwd").addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkPassword();
  });
  async function checkPassword() {
    const val = document.getElementById("pwd").value;
    const btn = document.getElementById("pwd-btn");
    btn.disabled = true;
    btn.textContent = "Vérification...";
    document.getElementById("pwd-err").style.display = "none";
    try {
      const res = await fetch(NETWORK_STATS_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ password: val }),
      });
      if (!res.ok) {
        document.getElementById("pwd-err").style.display = "block";
        btn.disabled = false;
        btn.textContent = "Accéder";
        return;
      }
      const data = await res.json();
      DASHBOARD_PWD = val;
      document.getElementById("gate").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      renderDashboard(data);
    } catch (err) {
      document.getElementById("pwd-err").textContent = "Erreur de connexion. Réessayez.";
      document.getElementById("pwd-err").style.display = "block";
      btn.disabled = false;
      btn.textContent = "Accéder";
    }
  }
  function renderDashboard(data) {
    const boutiques = data.boutiques || [];
    const adhesions = data.adhesions || [];
    let clientsById = {};
    (data.clients || []).forEach((c) => { clientsById[c.id] = c; });
    LAST_DATA = { boutiques, adhesions, clientsById };
    if (boutiques.length === 0 && adhesions.length === 0) {
      document.getElementById("grid").innerHTML = '<div class="empty">Impossible de charger les données.</div>';
      return;
    }
    // Export global : tous les clients, toutes boutiques confondues
    document.getElementById("export-all-btn").onclick = () =>
      exportCsv(adhesions, boutiques, clientsById, "ancrimo_clients_reseau");
    // --- Totaux réseau ---
    const totalInscrits = adhesions.length;
    const totalPassages = adhesions.reduce((sum, a) => sum + (a.nb_passages_total || 0), 0);
    const totalPalier6 = adhesions.filter((a) => a.nb_passages_cycle_actuel >= 6).length;
    const totalPalier10 = adhesions.filter((a) => a.nb_passages_cycle_actuel >= 10).length;
    document.getElementById("totals").innerHTML = `
      <div class="card"><div class="n">${totalInscrits}</div><div class="l">Clients inscrits</div></div>
      <div class="card"><div class="n">${totalPassages}</div><div class="l">Passages total</div></div>
      <div class="card"><div class="n">${totalPalier6}</div><div class="l">Au palier 6+</div></div>
      <div class="card"><div class="n">${totalPalier10}</div><div class="l">Au palier 10+</div></div>
    `;
    // --- Par boutique ---
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    boutiques.forEach((boutique) => {
      const shopAdhesions = adhesions.filter((a) => a.boutique_id === boutique.id);
      const inscrits = shopAdhesions.length;
      const passages = shopAdhesions.reduce((sum, a) => sum + (a.nb_passages_total || 0), 0);
      const palier6 = shopAdhesions.filter((a) => a.nb_passages_cycle_actuel >= 6 && a.nb_passages_cycle_actuel < 10).length;
      const palier10 = shopAdhesions.filter((a) => a.nb_passages_cycle_actuel >= 10).length;
      const pct6 = inscrits ? (palier6 / inscrits) * 100 : 0;
      const pct10 = inscrits ? (palier10 / inscrits) * 100 : 0;
      const sortedList = [...shopAdhesions].sort((a, b) =>
        new Date(b.date_inscription) - new Date(a.date_inscription)
      );
      const card = document.createElement("div");
      card.className = "shop-card";
      card.innerHTML = `
        <h3>${boutique.nom}</h3>
        <div class="shop-stats">
          <div><div class="n">${inscrits}</div><div class="l">Inscrits</div></div>
          <div><div class="n">${passages}</div><div class="l">Passages</div></div>
        </div>
        <div class="bar-track">
          <div class="bar-seg-6" style="width:${pct6}%"></div>
          <div class="bar-seg-10" style="width:${pct10}%"></div>
        </div>
        <div class="bar-legend">
          <span class="l6">${palier6} au palier 6</span>
          <span class="l10">${palier10} au palier 10</span>
        </div>
        <div class="detail" id="detail-${boutique.id}">
          ${
            sortedList.length
              ? sortedList
                  .map(
                    (a) => `
            <div class="detail-row">
              <span class="name">${(clientsById[a.client_id] && clientsById[a.client_id].prenom) || "?"}</span>
              <span class="cycle">${a.nb_passages_cycle_actuel}/6 · inscrit le ${new Date(a.date_inscription).toLocaleDateString("fr-FR")}</span>
            </div>`
                  )
                  .join("")
              : '<div class="empty" style="padding:10px 0;">Aucun client inscrit.</div>'
          }
          ${sortedList.length ? `<button class="shop-export" data-boutique-id="${boutique.id}">⬇ Exporter cette boutique (CSV)</button>` : ""}
        </div>
      `;
      card.addEventListener("click", (e) => {
        if (e.target.classList.contains("shop-export")) return;
        document.getElementById(`detail-${boutique.id}`).classList.toggle("open");
      });
      const exportBtn = card.querySelector(".shop-export");
      if (exportBtn) {
        exportBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          exportCsv(shopAdhesions, [boutique], clientsById, `ancrimo_clients_${boutique.nom}`);
        });
      }
      grid.appendChild(card);
    });
    if (boutiques.length === 0) {
      grid.innerHTML = '<div class="empty">Aucune boutique trouvée.</div>';
    }
    initCampaignBox(boutiques);
  }
  function csvEscape(val) {
    const s = (val === null || val === undefined) ? "" : String(val);
    if (s.includes(";") || s.includes('"') || s.includes("\n")) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }
  function exportCsv(adhesionsList, boutiquesList, clientsById, filenamePrefix) {
    const boutiqueNomById = {};
    boutiquesList.forEach((b) => { boutiqueNomById[b.id] = b.nom; });
    const headers = [
      "Prenom", "Telephone", "Email", "Boutique",
      "Passages total", "Cycle actuel", "Date inscription", "Consentement SMS/Email",
    ];
    const rows = adhesionsList.map((a) => {
      const c = clientsById[a.client_id] || {};
      const telephoneTexte = c.telephone ? `="${c.telephone}"` : "";
      const otherFields = [
        c.prenom || "",
        c.email || "",
        boutiqueNomById[a.boutique_id] || "",
        a.nb_passages_total || 0,
        a.nb_passages_cycle_actuel || 0,
        a.date_inscription ? new Date(a.date_inscription).toLocaleDateString("fr-FR") : "",
        c.consentement_marketing ? "Oui" : "Non",
      ].map(csvEscape);
      // Le téléphone est inséré tel quel (format formule Excel ="0612345678"),
      // il ne doit pas passer par csvEscape qui casserait la syntaxe.
      return [otherFields[0], telephoneTexte, ...otherFields.slice(1)].join(";");
    });
    const csvContent = "﻿" + [headers.join(";"), ...rows].join("\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const date = new Date().toISOString().split("T")[0];
    link.href = url;
    link.download = `${filenamePrefix}_${date}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  // --- Campagnes email ---
  function initCampaignBox(boutiques) {
    const select = document.getElementById("campaign-boutique");
    select.innerHTML = '<option value="">Tout le réseau</option>' +
      boutiques.map((b) => `<option value="${b.id}">${b.nom}</option>`).join("");
    select.addEventListener("change", updateCampaignCount);
    updateCampaignCount();
    refreshQuota();

    const sendBtn = document.getElementById("campaign-send-btn");
    const confirmBox = document.getElementById("campaign-confirm");
    const confirmText = document.getElementById("campaign-confirm-text");
    const confirmYes = document.getElementById("campaign-confirm-yes");
    const confirmNo = document.getElementById("campaign-confirm-no");
    const resultBox = document.getElementById("campaign-result");

    sendBtn.addEventListener("click", () => {
      resultBox.className = "campaign-result";
      resultBox.textContent = "";
      const subject = document.getElementById("campaign-subject").value.trim();
      const message = document.getElementById("campaign-message").value.trim();
      if (!subject || !message) {
        resultBox.className = "campaign-result error";
        resultBox.textContent = "Merci de remplir le sujet et le message.";
        return;
      }
      const count = computeRecipientCount();
      const boutiqueLabel = select.options[select.selectedIndex].text;
      confirmText.innerHTML = `Confirmer l'envoi à <strong>${count}</strong> destinataire${count > 1 ? "s" : ""} (${boutiqueLabel}) ?`;
      confirmBox.classList.add("open");
    });

    confirmNo.addEventListener("click", () => {
      confirmBox.classList.remove("open");
    });

    confirmYes.addEventListener("click", async () => {
      confirmBox.classList.remove("open");
      sendBtn.disabled = true;
      sendBtn.textContent = "Envoi en cours...";
      resultBox.className = "campaign-result";
      resultBox.textContent = "";
      const subject = document.getElementById("campaign-subject").value.trim();
      const message = document.getElementById("campaign-message").value.trim();
      const boutique_id = select.value || null;
      try {
        const res = await fetch(SEND_CAMPAIGN_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ password: DASHBOARD_PWD, subject, message, boutique_id }),
        });
        const data = await res.json();
        if (!res.ok) {
          resultBox.className = "campaign-result error";
          if (data.error === "quota_depasse") {
            resultBox.textContent = `Quota mensuel atteint (${data.campagnes_utilisees}/${data.quota_total} campagnes ce mois). Contactez Ancrimo pour ajouter des campagnes supplémentaires.`;
          } else if (data.error === "limite_journaliere") {
            resultBox.textContent = `Cette campagne vise ${data.destinataires} destinataires mais il ne reste que ${data.restant_aujourdhui} envois possibles aujourd'hui. Réessayez demain ou ciblez une seule boutique.`;
          } else if (data.error === "aucun_destinataire") {
            resultBox.textContent = "Aucun destinataire éligible (consentement + email) pour cette cible.";
          } else {
            resultBox.textContent = "Erreur : " + (data.error || res.status);
          }
        } else {
          resultBox.className = "campaign-result ok";
          resultBox.textContent = `Envoyé à ${data.sent} destinataire(s).${data.errors ? " " + data.errors + " erreur(s) d'envoi." : ""} Il vous reste ${data.campagnes_restantes} campagne(s) ce mois.`;
          document.getElementById("campaign-subject").value = "";
          document.getElementById("campaign-message").value = "";
        }
        refreshQuota();
      } catch (err) {
        resultBox.className = "campaign-result error";
        resultBox.textContent = "Erreur de connexion. Réessayez.";
      }
      sendBtn.disabled = false;
      sendBtn.textContent = "Envoyer la campagne";
    });
  }

  function computeRecipientCount() {
    if (!LAST_DATA) return 0;
    const boutiqueId = document.getElementById("campaign-boutique").value;
    const { adhesions, clientsById } = LAST_DATA;
    const relevant = boutiqueId ? adhesions.filter((a) => a.boutique_id === boutiqueId) : adhesions;
    const clientIds = [...new Set(relevant.map((a) => a.client_id))];
    return clientIds.filter((id) => {
      const c = clientsById[id];
      return c && c.consentement_marketing && c.email;
    }).length;
  }

  // Interroge le serveur pour connaître le quota réel (le serveur fait foi).
  async function refreshQuota() {
    const box = document.getElementById("campaign-quota");
    try {
      const res = await fetch(SEND_CAMPAIGN_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ password: DASHBOARD_PWD, preview: true }),
      });
      if (!res.ok) { box.textContent = ""; return; }
      const q = await res.json();
      box.innerHTML =
        `<strong>${q.campagnes_restantes}</strong> campagne${q.campagnes_restantes > 1 ? "s" : ""} restante${q.campagnes_restantes > 1 ? "s" : ""} ce mois (${q.campagnes_utilisees}/${q.quota_total} utilisée${q.campagnes_utilisees > 1 ? "s" : ""}) · <strong>${q.restant_aujourdhui}</strong> envois possibles aujourd'hui.`;
    } catch (e) {
      box.textContent = "";
    }
  }

  function updateCampaignCount() {
    const count = computeRecipientCount();
    document.getElementById("campaign-count").innerHTML =
      `<strong>${count}</strong> destinataire${count > 1 ? "s" : ""} recevront cet email (consentement + email renseigné).`;
  }
</script>
</body>
</html>
